# === Catálogo de temas activos ===
# estado: produccion | piloto  (piloto => disclaimer visible en el dashboard)
temas:
  frontera_sur:
    estado: produccion
    nombre: Frontera Sur (España-Marruecos)
  geopolitica_ue_marruecos:
    estado: produccion
    nombre: Geopolítica UE-Marruecos
  politica_nacional:
    estado: piloto
    nombre: Política nacional
    disclaimer: Este radar está en fase de calibración — el volumen de coordinación legítima en política es alto y el sistema
      aún está ajustando umbrales.
    # Tuning por tema (piloto): la coordinación humano/partidista legítima tiene
    # sync+contenido altos pero anomalía ~0. Se sube mucho el peso de la anomalía
    # para que SOLO ella (o señales de infraestructura reales) eleve a ANOMALOUS+,
    # evitando marcar ruido político ordinario como amenaza.
    scoring:
      weights:
        synchronization: 0.15
        content_similarity: 0.15
        amplification: 0.10
        infrastructure: 0.10
        network_density: 0.10
        anomaly: 0.40
