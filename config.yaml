scoring:
  bands:
    NORMAL:
    - 0
    - 19
    WATCH:
    - 20
    - 39
    ANOMALOUS:
    - 40
    - 59
    HIGH:
    - 60
    - 79
    CRITICAL:
    - 80
    - 100
  weights:
    synchronization: 0.25
    content_similarity: 0.2
    amplification: 0.2
    infrastructure: 0.15
    network_density: 0.1
    anomaly: 0.1
detection:
  tight_timing_seconds: 60
  near_duplicate_threshold: 0.7
  burst_interval_s: 10
  burst_min_events: 5
  burst_co_times: 2
  min_cluster_size: 3
  anomaly_percentile: 0.85
  contamination: 0.1
  random_state: 42
thresholds:
  tight_timing_seconds: 60
  near_duplicate_threshold: 0.7
  burst_interval_s: 10
  burst_min_events: 5
  burst_co_times: 2
  min_cluster_size: 3
  anomaly_percentile: 0.85
anomaly:
  contamination: 0.1
  random_state: 42
clustering:
  eps: 0.7
  min_samples: 2
  method: both
weights:
  same_url: 3
  same_domain: 1
  near_duplicate_text: 3
  same_hashtag: 1
  tight_timing: 4
  same_action_pattern: 2
features:
  min_text_len: 20
  ngram_range:
  - 1
  - 2
  top_hashtags: 50
