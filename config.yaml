scoring:
  bands:
    NORMAL:
    - 0
    - 19
    WATCH:
    - 20
    - 39
    ANOMALOUS:
    - 40
    - 59
    HIGH:
    - 60
    - 79
    CRITICAL:
    - 80
    - 100
  weights:
    synchronization: 0.25
    content_similarity: 0.2
    amplification: 0.2
    infrastructure: 0.15
    network_density: 0.1
    anomaly: 0.1
  # Límite por escala (nº de cuentas): un cluster pequeño (2-3 cuentas) puede
  # llegar a HIGH pero NO a CRITICAL — la señal de red orquestada a gran escala
  # debe alarmar más que una pareja de cuentas sincronizadas. Configurable por
  # tema en temas.<tema>.scoring.scale_min_accounts.
  scale_min_accounts:
    HIGH: 2
    CRITICAL: 10
  # Bonus por escala (05/Sep): a igualdad de componentes, más cuentas puntúan
  # más. Corrige el orden invertido (cluster de 2 cuentas >= cluster de 49).
  # bonus = min(cap, cuentas*per_account), acotado para no desbordar.
  scale_bonus:
    cap: 3.5
    per_account: 0.08
  # Piso híbrido de masa (05/Sep): cluster < min_accounts cuentas => banda máx
  # WATCH ("posible ruido de bajo volumen") SALVO evidencia adicional
  # (>= except_events eventos sostenidos o infraestructura >= except_infra), en
  # cuyo caso puede llegar a HIGH (79) pero NUNCA CRITICAL. Configurable por
  # tema en temas.<tema>.scoring.scale_floor.
  scale_floor:
    min_accounts: 3
    except_events: 10
    except_infra: 80
  # Tope por "origen único" (11/Sep): un cluster con <= max_urls URLs distintas
  # (y >= min_events eventos) es un "eco de 1 pieza" (varias cuentas repitiendo
  # el mismo artículo), no coordinación con producción propia. Se topa a la
  # banda cap_band (ANOMALOUS=59) para que el eco de agencia no se lea como
  # banda alta. Etiqueta "Eco de 1 pieza" en assessment/tarjetas. Configurable
  # por tema en temas.<tema>.scoring.origen_unico.
  origen_unico:
    max_urls: 1
    min_events: 2
    cap_band: ANOMALOUS
detection:
  tight_timing_seconds: 60
  near_duplicate_threshold: 0.7
  burst_interval_s: 10
  burst_min_events: 5
  burst_co_times: 2
  min_cluster_size: 2
  anomaly_percentile: 0.85
  contamination: 0.1
  random_state: 42
thresholds:
  tight_timing_seconds: 60
  near_duplicate_threshold: 0.7
  burst_interval_s: 10
  burst_min_events: 5
  burst_co_times: 2
  min_cluster_size: 2
  anomaly_percentile: 0.85
anomaly:
  contamination: 0.1
  random_state: 42
clustering:
  eps: 0.7
  min_samples: 2
  method: both
  # Componentes conexas que superan este nº de cuentas se parten en comunidades
  # (greedy modularity) para evitar "macro-clusters" por encadenamiento
  # transitivo. 0 = desactivar el split. Los componentes pequeños no se tocan.
  max_component_size: 50
weights:
  same_url: 3
  same_domain: 1
  near_duplicate_text: 3
  same_hashtag: 1
  tight_timing: 4
  same_action_pattern: 2
features:
  min_text_len: 20
  ngram_range:
  - 1
  - 2
  top_hashtags: 50
coordination:
  # Palancas de memoria del grafo de coordinación (escalar fuentes sin OOM).
  # window_days: ventana del grafo en días (90 = alineada con la retención;
  #   bajarla reduce memoria/cómputo). tfidf_max_features: tope de vocabulario.
  window_days: 90
  tfidf_max_features: 200000
