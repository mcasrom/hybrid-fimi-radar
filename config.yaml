temas:
  frontera_sur:
    estado: produccion
    nombre: Frontera Sur (España-Marruecos)
  geopolitica_ue_marruecos:
    estado: cerrado
    nombre: Geopolítica UE-Marruecos
  politica_nacional:
    estado: produccion
    nombre: Política nacional
    # Tuning por tema: la coordinación humano/partidista legítima tiene
    # sync+contenido altos pero anomalía ~0. Se sube mucho el peso de la anomalía
    # para que SOLO ella (o señales de infraestructura reales) eleve a ANOMALOUS+,
    # evitando marcar ruido político ordinario como amenaza.
    scoring:
      weights:
        synchronization: 0.15
        content_similarity: 0.15
        amplification: 0.10
        infrastructure: 0.10
        network_density: 0.10
        anomaly: 0.40
  eeuu_politica:
    estado: produccion
    nombre: Política y desinformación EEUU
    # Tuning por tema (igual que politica_nacional): la coordinación partidista/
    # editorial legítima sobre política estadounidense tiene sync+contenido
    # altos pero anomalía baja. Se sube el peso de la anomalía para que SOLO
    # ella (o señales de infraestructura reales) eleve a ANOMALOUS+, evitando
    # marcar el eco político ordinario como señal de campaña en el piloto.
    scoring:
      weights:
        synchronization: 0.15
        content_similarity: 0.15
        amplification: 0.10
        infrastructure: 0.10
        network_density: 0.10
        anomaly: 0.40
  oriente_medio:
    estado: produccion
    nombre: Oriente Medio (Israel-Irán-Gaza)
    # Tuning por tema (piloto): el ruido editorial/activista sobre el conflicto
    # tiene sync+contenido altos con anomalía baja; subir la anomalía evita
    # marcar coordinación legítima de difusión como campaña inorgánica.
    scoring:
      weights:
        synchronization: 0.15
        content_similarity: 0.15
        amplification: 0.10
        infrastructure: 0.10
        network_density: 0.10
        anomaly: 0.40
    filtro:
    - Gaza Israel
    - Hezbollah
    - Hamas
    - Houthi
    - Hutíes
    - Cisjordania
    # Términos nativos FR (17/09): el catálogo tiene feeds en francés (Le Monde,
    # France24) cuya cobertura del conflicto no matcheaba el filtro ES/EN.
    # Solo al filtro (no crea queries de captura). +~965 ev medidos.
    - Liban
    - Cisjordanie
    - Yémen
    - bande de Gaza
    - Beyrouth
    # Términos ampliados (18/09): cubrir titulares ME (Israel/West Bank/Líbano/
    # Gaza) que no matcheaban el filtro y caían en `frontera_sur`. Solo al filtro
    # (no crea queries). Medir backfill + contaminación de Ceuta.
    - Gaza
    - West Bank
    - Líbano
    - Lebanon
  sahel:
    estado: produccion
    nombre: Sahel (África Occidental)
  energia:
    estado: produccion
    nombre: Energía (petróleo/gas/precios)
    filtro:
    - petróleo
    - crudo
    - oil
    - opep
    - opec
    - brent
    - ormuz
    - hormuz
    - gas
    - gasoducto
    - lng
    - medgaz
    - sonatrach
    - refinería
    - hidrocarburo
    - combustible
    - barril
    - electricidad
    - eléctrica
    - eléctrico
    - energía
    - energético
    - tarifa
    - renovable
    - solar
    - eólica
    - eólico
    - nuclear
    - hidrógeno
    - carbón
    - precio de la luz
    # Tuning por tema (piloto): en `energia` la señal discriminante es la anomalía
    # (cuentas automatizadas repitiendo titulares de petróleo). El eco mainstream de
    # una noticia real (p.ej. "Trump EPA elimina los límites de emisiones") tiene
    # sync/infra/densidad altos con anomalía ~0 y NO debe encabezar el tema. Se sube
    # el peso de la anomalía para que ese eco caiga a WATCH y solo la amplificación
    # inauténtica quede arriba.
    scoring:
      weights:
        synchronization: 0.15
        content_similarity: 0.15
        amplification: 0.10
        infrastructure: 0.10
        network_density: 0.10
        anomaly: 0.40
  elecciones:
    estado: piloto
    nombre: Elecciones e interferencia electoral
    # Ventanas de validación/cierre para un tema de CICLO LARGO (electoral): la
    # promoción exige 30 días (no 72 h) y el cierre no se sugiere con elecciones
    # registradas a ±120 días (evita cerrar el tema en un valle entre procesos).
    # Si el bloque falta, se usan los defaults globales (env FIMI_*).
    ventanas:
      promocion_h: 720
      promocion_ciclos: 96
      cierre_ventana_dias: 90
      cierre_findings_por_dia: 1.0
      cierre_min_dias: 30
      cierre_piloto_dias: 365
      cierre_calendario_dias: 120
    # Gate: un evento solo conserva el tema si su texto contiene >=1 término
    # electoral real (evita que "afd" del boletín meteorológico "Area Forecast
    # Discussion", o menciones tangenciales, lo etiqueten como electoral).
    filtro:
    - elecciones
    - electoral
    - campaña electoral
    - urnas
    - papeletas
    - fraude electoral
    - midterms
    - medio mandato
    - election interference
    - sondeos
    - votantes
    # Términos electorales DE/SE (idiomas de los feeds del capítulo electoral):
    # sin ellos, el contenido electoral alemán/sueco no pasa el gate del tema.
    - landtagswahl
    - bundestagswahl
    - europawahl
    - wahlkampf
    - wahlen
    - wähler
    # Términos electorales NATIVOS de los procesos de alto valor registrados en
    # data/elecciones.yaml (Rusia/LV/BS/SR/PT/BG, 17-sep-2026): sin ellos el
    # discurso doméstico de esos países no pasa el gate del tema.
    - выборы
    - госдума
    - vēlēšanas
    - saeima
    - izbori
    - eleições
    - избори
    - riksdag
    - riksdagsval
    - valet
    - väljare
    - rösta
    - valrörelse
    # Segundo nivel (CLASIFICACIÓN, no captura): un cluster del tema se marca
    # como "interferencia" (señal) si su texto contiene >=1 término de esta
    # lista; si no, "cobertura electoral" (ruido esperable). Separa señal de
    # ruido sin recortar la captura del tema. Léxico ES/EN.
    senal:
    - desinformación
    - disinformation
    - misinformation
    - manipulación
    - manipular
    - interferencia
    - interference
    - injerencia
    - propaganda
    - operación de influencia
    - influence operation
    - noticias falsas
    - fake news
    - fake
    - bulo
    - bulos
    - hoax
    - troll
    - trolls
    - bot
    - bots
    - granja de trolls
    - troll farm
    - coordinado inauténtico
    - coordinated inauthentic
    - inauténtico
    - deepfake
    - hackeo
    - ciberataque
    - cyberattack
    - pucherazo
    - fraude electoral
    - election interference
    - foreign interference
  inteligencia_artificial:
    estado: piloto
    nombre: Inteligencia artificial
    filtro:
    - inteligencia artificial
    - artificial intelligence
    - OpenAI
    - ChatGPT
    - Gemini
    - Claude
    - Anthropic
    - deepfake
    - Nvidia
    - ia
