# Registro curado de episodios de protestas juveniles.
#
# Una fila por episodio. El radar mide AMPLIFICACIÓN y extensión con las
# keywords del tema `protestas_juveniles`; este registro aporta lo que el
# pipeline NO puede inferir: demandas y llamadas documentadas, con su fuente.
#
# Regla: `fuente_primaria` solo se rellena si existe un documento primario
# localizado. Si no, queda vacío y se usan fuentes periodísticas enlazadas.
# No se atribuye autoría ni intención sin prueba independiente.
#
# Actualizado: 2026-10-28.

