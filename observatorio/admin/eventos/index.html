<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Revisar acontecimientos · Admin</title><style>:root{--a:#b45309;--i:#1e293b;--m:#64748b;--l:#fde68a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8fafc;color:var(--i);line-height:1.5}.wrap{max-width:980px;margin:0 auto;padding:28px 18px}h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1rem;margin:0 0 6px}.muted{color:var(--m);font-size:.85rem}.box{background:#fff;border:1px solid #e2e8f0;border-left:4px solid var(--a);border-radius:8px;padding:12px;margin:10px 0}.event{background:#fff;border:1px solid #e2e8f0;border-left:4px solid var(--a);border-radius:8px;padding:12px;margin:10px 0}.event h2{font-size:.98rem}.meta{font-size:.76rem;color:var(--m)}.pubs{margin:6px 0;padding-left:18px;font-size:.84rem}.pubs li{margin:4px 0}.actions{display:flex;gap:8px;margin-top:8px}.selectrow{display:flex;gap:8px;align-items:center;font-size:.8rem;color:#475569;margin-top:6px}.selectrow input{accent-color:#b45309}.actions button{font:inherit;font-size:.8rem;border:1px solid #e2e8f0;border-radius:6px;padding:5px 10px;background:#fff;cursor:pointer}.ok{border-color:#86efac;color:#166534}.hide{border-color:#fecaca;color:#991b1b}.good{color:#166534}.bad{color:#b91c1c}a{color:var(--a)}</style></head><body><div class="wrap"><p><a href="/observatorio/admin/">← Admin</a></p><h1>Revisar acontecimientos</h1><p class="muted">Solo grupos dudosos: una sola fuente o cohesión baja. Aprobar significa “la agrupación es razonable”, no “el hecho está confirmado”.</p><p id="msg" class="muted">Cargando…</p><p><button id="merge" type="button" style="font:inherit;padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer">Fusionar seleccionados</button></p><div id="list"></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{try{return new Date(s).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'})}catch(e){return s||''}};
function load(){fetch('/api/observatorio/admin/events?topic=frontera_sur&x='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{document.getElementById('msg').textContent=d.count+' candidatos pendientes';document.getElementById('list').innerHTML=(d.events||[]).map(e=>`<article class="event" data-id="${esc(e.id)}"><label class="selectrow"><input type="checkbox" class="evsel" value="${esc(e.id)}"> Seleccionar este grupo para fusionar</label><h2>${esc(e.title)}</h2><p class="meta">${e.n_publications} publicaciones · ${e.n_sources} fuentes · ${fmt(e.first_published)} → ${fmt(e.last_published)} · ${esc(e.review_reason||'dudoso')}</p><details><summary>Publicaciones</summary><ul class="pubs">${(e.publications||[]).map(p=>`<li><label class="selectrow"><input type="checkbox" class="itsel" value="${esc(p.id)}"> separar</label> <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a> <span class="muted">— ${esc(p.source)}</span></li>`).join('')}</ul></details><div class="actions"><button class="ok" data-action="approve">Aprobar agrupación</button><button class="hide" data-action="hide">Ocultar</button><button data-action="split">Separar seleccionadas</button></div></article>`).join('')||'<div class="box good">No hay candidatos dudosos.</div>';}).catch(e=>{document.getElementById('msg').innerHTML='<span class="bad">No se pudo cargar: '+esc(e.message)+'</span>';});}
document.getElementById('list').addEventListener('click',async ev=>{const b=ev.target.closest('button[data-action]');if(!b)return;const card=b.closest('.event');const id=card.dataset.id;b.disabled=true;try{let body={action:b.dataset.action};if(b.dataset.action==='split'){body.item_ids=[...card.querySelectorAll('.itsel:checked')].map(x=>x.value);if(!body.item_ids.length)throw Error('Selecciona publicaciones');}const r=await fetch('/api/observatorio/admin/events/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('HTTP '+r.status);card.remove();document.getElementById('msg').textContent='Acción aplicada.';}catch(e){b.disabled=false;document.getElementById('msg').innerHTML='<span class="bad">Error: '+esc(e.message)+'</span>';}});
document.getElementById('merge').addEventListener('click',async()=>{const ids=[...document.querySelectorAll('.evsel:checked')].map(x=>x.value);if(ids.length<2){document.getElementById('msg').innerHTML='<span class="bad">Selecciona al menos dos grupos.</span>';return;}try{const r=await fetch('/api/observatorio/admin/events/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'merge',ids})});if(!r.ok)throw Error('HTTP '+r.status);document.getElementById('msg').textContent='Grupos fusionados.';load();}catch(e){document.getElementById('msg').innerHTML='<span class="bad">Error: '+esc(e.message)+'</span>';}});
load();
</script></body></html>
