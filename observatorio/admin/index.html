<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin · Observatorio</title><style>:root{--a:#b45309;--i:#1e293b;--m:#64748b;--l:#fde68a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8fafc;color:var(--i);line-height:1.5}.wrap{max-width:980px;margin:0 auto;padding:28px 18px}h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1rem;margin:24px 0 8px;border-bottom:2px solid var(--l);padding-bottom:4px}.muted{color:var(--m);font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px}.card b{display:block;font-size:1.45rem;color:var(--a)}.card span{font-size:.76rem;color:var(--m)}.box{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin:10px 0}.ok{color:#166534}.bad{color:#b91c1c}a{color:var(--a)}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{border-bottom:1px solid #e2e8f0;padding:6px;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}} </style></head><body><div class="wrap"><p class="muted">Privado · Observatorio de lo publicado</p><h1>Admin mínimo</h1><p class="muted">Estado operativo. Sin métricas internas ni panel de FIMI.</p><p><a href="/observatorio/admin/eventos/"><b>Revisar candidatos dudosos →</b></a></p><p id="stamp" class="muted">Cargando…</p><div id="app"></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('status.json?x='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('status '+r.status);return r.json()}).then(d=>{
 const c=d.content||{},s=d.subscriptions||{};
 document.getElementById('stamp').textContent='Generado: '+d.generated_at;
 const cards=[['Fichas',c.fichas],['Fuentes',c.fuentes],['Primarias',c.primarias],['Temas',c.temas],['Frontera Sur',c.fichas_ceuta],['Protestas juveniles',c.episodios_juventud],['Elecciones generales',c.hitos_campana],['Suscripciones',s.total]].map(([k,v])=>`<div class="card"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');
 const sub=`<table><tr><th>Estado</th><th>N</th></tr><tr><td>Pendientes</td><td>${esc(s.pending)}</td></tr><tr><td>Confirmadas</td><td>${esc(s.confirmed)}</td></tr><tr><td>Bajas</td><td>${esc(s.unsubscribed)}</td></tr></table>`;
 const pages=Object.entries(d.pages||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="${v===200?'ok':'bad'}">${esc(v)}</td></tr>`).join('');
 document.getElementById('app').innerHTML=`<div class="grid">${cards}</div><h2>Suscripciones nuevas</h2><div class="box">${sub}<p class="muted">Lista nueva, doble opt-in. La lista antigua de FIMI no se migra.</p></div><h2>Páginas</h2><div class="box"><table>${pages}</table></div><h2>Salud de fuentes</h2><div class="box" id="fh"></div><h2>Propuestas y comentarios</h2><div class="box"><p><b>No hay cola.</b> La web no tiene formulario público de propuestas ni comentarios.</p><p>El canal es <a href="mailto:info-fimi@viajeinteligencia.com">info-fimi@viajeinteligencia.com</a>.</p></div><h2>Notas</h2><div class="box"><ul>${(d.notes||[]).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`;
const fh=d.feed_health||{}; const fhel=document.getElementById('fh'); if(fhel) fhel.innerHTML=`<p><b>${esc(fh.ok||0)} OK</b> · ${esc(fh.error||0)} con error · ${esc(fh.total||0)} total</p>`+(fh.errors||[]).map(x=>'<p class="bad">'+esc(x.name)+': '+esc(x.error)+'</p>').join('');
}).catch(e=>{document.getElementById('app').innerHTML='<div class="box bad">No se pudo cargar status.json: '+esc(e.message)+'</div>'});
</script></body></html>
