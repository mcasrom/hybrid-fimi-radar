    # API de revisión de eventos: misma auth que el admin
    location ^~ /api/observatorio/admin/ {
        auth_basic "Observatorio admin";
        auth_basic_user_file /etc/nginx/.htpasswd_observatorio;
        proxy_pass http://127.0.0.1:3032;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }
