    # Admin privado del observatorio
    location = /admin.html {
        return 301 /observatorio/admin/;
    }
    location ^~ /observatorio/admin/ {
        auth_basic "Observatorio admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
