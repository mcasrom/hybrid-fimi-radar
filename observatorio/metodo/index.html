<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Método</title><meta name="description" content="Registro de lo publicado: datos, método, fuentes y límites."><style>:root{--a:#b45309;--i:#1e293b;--m:#64748b;--l:#fde68a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fff,#fffaf5);color:var(--i);line-height:1.6}.wrap{max-width:900px;margin:0 auto;padding:32px 20px 64px}a{color:var(--a)}h1{font-size:1.9rem;margin:0 0 6px}h2{font-size:1.15rem;border-bottom:2px solid var(--l);padding-bottom:5px;margin:28px 0 8px}h3{margin:0 0 4px}.muted{color:var(--m);font-size:.85rem}.lead{font-size:1.02rem;color:#334155;max-width:68ch}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 24px;font-size:.9rem}.nav a{padding:6px 10px;border:1px solid #e2e8f0;border-radius:999px;text-decoration:none;background:#fff}.card{background:#fff;border:1px solid #e2e8f0;border-left:5px solid var(--a);border-radius:12px;padding:16px 18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;text-align:center}.stat b{display:block;font-size:1.8rem;color:var(--a)}.stat span{font-size:.8rem;color:var(--m)}.box{background:#fff7ed;border-left:4px solid var(--a);padding:10px 14px;border-radius:7px}li{margin:5px 0}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{border-bottom:1px solid #e2e8f0;padding:7px;text-align:left;vertical-align:top}footer{margin-top:34px;border-top:1px solid var(--l);padding-top:16px;color:var(--m);font-size:.82rem}@media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:1.45rem}}</head><body><div class="wrap"><p class="muted">Observatorio de lo publicado · <a href="/observatorio/">inicio</a></p><nav class="nav"><a href="/observatorio/">Inicio</a><a href="/observatorio/ceuta/">Ceuta</a><a href="/observatorio/juventud/">Juventud</a><a href="/observatorio/campana/">Campaña</a><a href="/observatorio/metodo/">Método</a><a href="/observatorio/fuentes/">Fuentes</a><a href="/observatorio/datos/">Datos</a><a href="/observatorio/sobre/">Sobre</a></nav><h1>Método</h1><p class="lead">Este registro documenta lo que se publica y lo que puede comprobarse. No convierte una publicación en un hecho.</p><h2>Qué se registra</h2><ul><li><b>Afirmaciones publicadas:</b> título, medio, fecha y enlace.</li><li><b>Episodios:</b> fecha, ciudad, convocantes citados, demandas y estado.</li><li><b>Calendario:</b> fechas oficiales del BOE.</li></ul><h2>Cómo se obtiene</h2><p>La selección es manual a partir de fuentes públicas. El calendario se extrae automáticamente del real decreto del BOE y se valida. No hay captura automática de acontecimientos ni confirmación automática.</p><h2>Estados</h2><ul><li><b>Secundaria:</b> solo prensa o referencia secundaria.</li><li><b>Documentada:</b> existe un documento oficial o declaración directa.</li><li><b>Pendiente:</b> falta fuente primaria o contraste.</li><li><b>No consta:</b> no hay información suficiente.</li></ul><h2>Qué no se hace</h2><ul><li>No se atribuye autoría ni intención.</li><li>No se confirma un acto por su fecha prevista.</li><li>No se usan clústeres, bandas, scores ni métricas internas.</li></ul><footer>Actualizado: 30-Oct-2026 14:15 UTC. Registro de lo publicado; no confirma hechos. · <a href="/privacidad.html">Privacidad</a></footer></div></body></html>
