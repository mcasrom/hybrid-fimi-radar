    # API privada de la lista nueva del observatorio
    location ^~ /api/observatorio/ {
        limit_req zone=fimi_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3032;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }
    # La suscripción antigua queda redirigida a la nueva
    location = /suscribirse.html {
        return 301 /observatorio/suscribirse/;
    }
